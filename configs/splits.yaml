# Sample partition (pre-registered 2026-09-05). Machine-readable twin of data/partitions.csv.
# Rule: chronological only; no random K-fold anywhere; purge on the EARLIER side of each boundary.
purge_trading_days: 10
embargo_rule: ">= max(holding_period, feature_window)"
primary_intraday:
  dev:
    start: "2013-10-23"    # resolved 2026-09-06 (post-audit): first date with trailing-60-day intraday coverage >= 0.80 (06_DATA_AUDIT.md). NOTE: the pre-audit grid ran from 2005-01-03 while this was null; the frozen holdout manifest hashed the null version.
    end: "2018-12-14"
  val:
    start: "2019-01-02"
    end: "2022-12-15"
    walk_forward: yearly_expanding
  holdout:
    start: "2023-01-03"
    end: "2026-08-31"
    locked: true
    single_run: true
secondary_daily:
  dev:
    start: "2005-01-03"    # or earliest available daily history if later
    end: "2018-12-14"
  val:
    start: "2019-01-02"
    end: "2022-12-15"
  holdout:
    start: "2023-01-03"
    end: "2026-08-31"
    locked: true
forward:
  start: "2026-09-08"
fallback_if_history_short:
  intraday: "STOP and report; do not improvise a split"
  daily_lt_16y: "holdout = last 20% but >= 2y; val = next 20%; dev = rest; quarterly walk-forward"
